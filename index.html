<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="BuyfromGAB: shop kids toys, electronics, pharmacy, clothes, beauty and home and kitchen. Order on WhatsApp.">
<title>BuyfromGAB – Shop by category</title>
<script>try{var t=localStorage.getItem("bazaar-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F5F6FA;
    --surface: #FFFFFF;
    --ink: #14213D;
    --muted: #5B6478;
    --line: #E1E4EC;
    --on-ink: #FFFFFF;
    --focus: #2F5BFF;
    --danger: #B3261E;
    --star: #F5A623;
    --star-off: #D5D9E4;
    --heart: #E5384F;

    --toys: #FFC93C;      --toys-ink: #3A2A00;
    --tech: #2F5BFF;      --tech-ink: #FFFFFF;
    --pharm: #3DD598;     --pharm-ink: #062B1E;
    --cloth: #FF7A9A;     --cloth-ink: #3B0A1B;
    --beauty: #B79CFF;    --beauty-ink: #1F1245;
    --home: #FF8A3D;      --home-ink: #3A1700;

    --display: "Bricolage Grotesque", "Trebuchet MS", "Segoe UI", sans-serif;
    --body: "DM Sans", "Segoe UI", system-ui, -apple-system, sans-serif;

    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0F1424; --surface: #181F36; --ink: #EEF0F7; --muted: #9AA3B8;
      --line: #2A3350; --on-ink: #0F1424; --focus: #8FA8FF; --danger: #FF8A80; --star-off: #3A4466; --heart: #FF6B81;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0F1424; --surface: #181F36; --ink: #EEF0F7; --muted: #9AA3B8;
    --line: #2A3350; --on-ink: #0F1424; --focus: #8FA8FF; --danger: #FF8A80; --star-off: #3A4466; --heart: #FF6B81;
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 76px); }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--body); font-size: 1rem; line-height: 1.5;
  }
  img, svg { max-width: 100%; display: block; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  [hidden] { display: none !important; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- Header ---------- */
  .site-header {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
    display: flex; align-items: center; gap: 16px;
    height: 68px; padding: 0 clamp(14px, 3vw, 32px);
    background: var(--bg); border-bottom: 1px solid var(--line);
  }
  .brand { font-family: var(--display); font-weight: 800; font-size: 1.5rem; letter-spacing: -0.02em; text-decoration: none; color: var(--ink); }
  .header-search { flex: 1; max-width: 460px; margin-left: auto; position: relative; }
  .header-search input {
    width: 100%; height: 44px; padding: 0 16px; border-radius: 999px;
    border: 1.5px solid var(--line); background: var(--surface);
  }
  .header-search input::placeholder { color: var(--muted); }
  .theme-btn {
    flex: none; width: 44px; height: 44px; border-radius: 50%;
    border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
    display: grid; place-items: center;
  }
  .theme-btn:hover { border-color: var(--ink); }
  .cart-btn {
    position: relative; height: 44px; padding: 0 18px; border-radius: 999px; border: 0;
    background: var(--ink); color: var(--on-ink); font-weight: 700;
    display: inline-flex; align-items: center; gap: 10px;
  }
  .cart-count {
    min-width: 24px; height: 24px; padding: 0 6px; border-radius: 999px;
    background: var(--toys); color: var(--toys-ink); font-size: .8rem; font-weight: 700;
    display: grid; place-items: center;
  }
  @media (max-width: 560px) {
    .brand { font-size: 1.25rem; }
    .cart-btn .cart-label { display: none; }
    .cart-btn { padding: 0 12px; }
  }

  /* ---------- Hero: category boxes only ---------- */
  .hero {
    padding: clamp(12px, 2vw, 24px);
    min-height: calc(100vh - 68px - env(safe-area-inset-top, 0px));
    min-height: calc(100svh - 68px - env(safe-area-inset-top, 0px));
    display: grid;
  }
  .category-grid {
    display: grid; gap: clamp(10px, 1.6vw, 20px);
    grid-template-columns: repeat(3, minmax(0, 1fr));
    grid-template-rows: repeat(2, minmax(190px, 1fr));
  }
  /* Phones and tablets (any orientation) and narrow windows: 2 boxes per row */
  @media (max-width: 900px), (pointer: coarse) {
    .category-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-template-rows: repeat(3, minmax(150px, 1fr));
    }
  }
  .tile {
    position: relative; overflow: hidden; text-align: left;
    display: flex; flex-direction: column; justify-content: flex-end;
    padding: clamp(14px, 2.4vw, 32px);
    border: 0; border-radius: 28px; text-decoration: none;
    background: var(--tile-bg); color: var(--tile-ink);
    transition: transform .25s cubic-bezier(.2,.8,.2,1);
  }
  .tile:hover { transform: translateY(-4px); }
  .tile:active { transform: translateY(0) scale(.99); }
  .tile .pictogram {
    position: absolute; top: clamp(10px, 2vw, 28px); right: clamp(10px, 2vw, 28px);
    width: clamp(64px, 12vw, 180px); height: auto;
    color: var(--tile-ink); transition: transform .35s cubic-bezier(.2,.8,.2,1);
  }
  .tile:hover .pictogram { transform: rotate(-6deg) scale(1.05); }
  .tile-name {
    font-family: var(--display); font-weight: 800; line-height: .95; letter-spacing: -0.03em;
    font-size: clamp(1.2rem, 3.4vw, 3rem); overflow-wrap: anywhere;
  }
  .tile-meta { margin-top: 8px; font-weight: 500; font-size: clamp(.85rem, 1.4vw, 1.05rem); opacity: .85; }
  .tile[data-cat="toys"]  { --tile-bg: var(--toys);  --tile-ink: var(--toys-ink); }
  .tile[data-cat="tech"]  { --tile-bg: var(--tech);  --tile-ink: var(--tech-ink); }
  .tile[data-cat="pharm"] { --tile-bg: var(--pharm); --tile-ink: var(--pharm-ink); }
  .tile[data-cat="cloth"] { --tile-bg: var(--cloth); --tile-ink: var(--cloth-ink); }
  .tile[data-cat="beauty"] { --tile-bg: var(--beauty); --tile-ink: var(--beauty-ink); }
  .tile[data-cat="home"]  { --tile-bg: var(--home);  --tile-ink: var(--home-ink); }

  /* ---------- Products ---------- */
  .shop { padding: clamp(24px, 5vw, 64px) clamp(14px, 3vw, 32px) 80px; max-width: 1280px; margin: 0 auto; }
  .shop-head { display: flex; flex-direction: column; align-items: flex-start; gap: 14px; margin-bottom: 14px; }
  .back-link { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 10px; color: var(--muted); font-weight: 500; text-decoration: none; }
  .back-link:hover { color: var(--ink); }
  .shop-head h1, .shop-head h2 { font-family: var(--display); font-weight: 800; letter-spacing: -0.02em; font-size: clamp(1.75rem, 4vw, 2.5rem); margin: 0; line-height: 1.05; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    height: 40px; padding: 0 16px; border-radius: 999px; font-weight: 500;
    background: var(--surface); border: 1.5px solid var(--line);
  }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }

  .products { display: grid; gap: clamp(12px, 2vw, 22px); grid-template-columns: repeat(auto-fill, minmax(min(100%, 210px), 1fr)); }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; display: flex; flex-direction: column; }
  .thumb { aspect-ratio: 1 / 1; display: grid; place-items: center; font-size: clamp(3rem, 8vw, 4.5rem); background: var(--thumb-bg, #DDE2F3); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .card[data-cat="toys"]  { --thumb-bg: color-mix(in srgb, var(--toys) 45%, var(--surface)); }
  .card[data-cat="tech"]  { --thumb-bg: color-mix(in srgb, var(--tech) 25%, var(--surface)); }
  .card[data-cat="pharm"] { --thumb-bg: color-mix(in srgb, var(--pharm) 40%, var(--surface)); }
  .card[data-cat="cloth"] { --thumb-bg: color-mix(in srgb, var(--cloth) 40%, var(--surface)); }
  .card[data-cat="beauty"] { --thumb-bg: color-mix(in srgb, var(--beauty) 40%, var(--surface)); }
  .card[data-cat="home"]  { --thumb-bg: color-mix(in srgb, var(--home) 40%, var(--surface)); }
  .card-body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .card-cat { color: var(--muted); font-size: .85rem; }
  .card-name { font-weight: 700; line-height: 1.25; }
  .card-foot { margin-top: auto; padding-top: 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .price { font-family: var(--display); font-weight: 800; font-size: 1.2rem; }
  .add-btn { height: 40px; padding: 0 16px; border-radius: 999px; border: 0; font-weight: 700; background: var(--ink); color: var(--on-ink); }
  .add-btn:active { transform: scale(.96); }
  .empty { grid-column: 1 / -1; padding: 48px 16px; text-align: center; color: var(--muted); }


  /* ---------- Clickable cards ---------- */
  .card { position: relative; }
  .card-link { color: inherit; text-decoration: none; }
  .card-link::after { content: ""; position: absolute; inset: 0; z-index: 1; }
  .card:hover .card-link { text-decoration: underline; }
  .card:has(.card-link:focus-visible) { outline: 3px solid var(--focus); outline-offset: 3px; }
  .card-link:focus-visible { outline: none; }
  .add-btn { position: relative; z-index: 2; }

  /* ---------- Filters ---------- */
  .filters {
    display: flex; flex-wrap: wrap; align-items: end; gap: 12px;
    margin: 0 0 24px; padding: 14px; background: var(--surface);
    border: 1px solid var(--line); border-radius: 16px;
  }
  .field { display: grid; gap: 4px; font-size: .85rem; color: var(--muted); }
  .field select, .field input {
    height: 40px; padding: 0 12px; border-radius: 10px; min-width: 0;
    border: 1.5px solid var(--line); background: var(--bg); color: var(--ink);
  }
  .filters .field input { width: 110px; }
  .count { margin-left: auto; align-self: center; color: var(--muted); }
  @media (max-width: 560px) {
    .filters .field { flex: 1 1 40%; }
    .filters .field input { width: 100%; }
    .count { margin-left: 0; flex-basis: 100%; }
  }

  /* ---------- Product page ---------- */
  .pd { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(20px, 4vw, 56px); align-items: start; margin-bottom: 64px; }
  @media (max-width: 720px) { .pd { grid-template-columns: minmax(0, 1fr); } }
  .pd-thumb { aspect-ratio: 1 / 1; border-radius: 28px; display: grid; place-items: center; overflow: hidden; font-size: clamp(6rem, 22vw, 11rem); background: var(--thumb-bg, #DDE2F3); }
  .pd-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .pd h1 { font-family: var(--display); font-weight: 800; letter-spacing: -0.02em; line-height: 1.05; font-size: clamp(1.9rem, 4.5vw, 3rem); margin: 6px 0 12px; }
  .pd-price { font-family: var(--display); font-weight: 800; font-size: 1.9rem; margin: 0 0 16px; }
  .pd-desc { max-width: 60ch; line-height: 1.65; margin: 0; }
  .pd-buy { display: flex; align-items: center; flex-wrap: wrap; gap: 16px; margin-top: 28px; }
  .pd-buy .qty button { width: 40px; height: 40px; }
  .pd-buy .qty span { min-width: 30px; font-size: 1.1rem; }
  .add-btn.big { height: 52px; padding: 0 30px; font-size: 1rem; }
  .related-title { font-family: var(--display); font-weight: 800; letter-spacing: -0.02em; font-size: 1.6rem; margin: 0 0 18px; }
  .pd[data-cat="toys"] { --thumb-bg: color-mix(in srgb, var(--toys) 45%, var(--surface)); }
  .pd[data-cat="tech"] { --thumb-bg: color-mix(in srgb, var(--tech) 25%, var(--surface)); }
  .pd[data-cat="pharm"] { --thumb-bg: color-mix(in srgb, var(--pharm) 40%, var(--surface)); }
  .pd[data-cat="cloth"] { --thumb-bg: color-mix(in srgb, var(--cloth) 40%, var(--surface)); }
  .pd[data-cat="beauty"] { --thumb-bg: color-mix(in srgb, var(--beauty) 40%, var(--surface)); }
  .pd[data-cat="home"] { --thumb-bg: color-mix(in srgb, var(--home) 40%, var(--surface)); }

  /* ---------- Checkout ---------- */
  .page-title { font-family: var(--display); font-weight: 800; letter-spacing: -0.02em; line-height: 1.05; font-size: clamp(1.9rem, 4vw, 2.5rem); margin: 0 0 24px; }
  .co { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: clamp(16px, 3vw, 40px); align-items: start; }
  @media (max-width: 820px) { .co { grid-template-columns: minmax(0, 1fr); } .co-summary { order: -1; position: static; } }
  .co-card { border: 1px solid var(--line); background: var(--surface); border-radius: 20px; padding: 20px; margin: 0 0 16px; min-width: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .co-card legend { font-family: var(--display); font-weight: 800; font-size: 1.15rem; padding: 0 8px; }
  .co-card .wide { grid-column: 1 / -1; }
  @media (max-width: 560px) { .co-card { grid-template-columns: minmax(0, 1fr); } }
  .co-card .field input, .co-card .field textarea { width: 100%; }
  .field textarea { padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); resize: vertical; min-width: 0; }
  .pay-opt { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 14px; border: 1.5px solid var(--line); border-radius: 14px; cursor: pointer; }
  .pay-opt:has(input:checked) { border-color: var(--ink); background: var(--bg); }
  .pay-opt input { width: 20px; height: 20px; accent-color: var(--ink); flex: none; }
  .pay-opt small { display: block; color: var(--muted); }
  .pay-opt.disabled { opacity: .6; cursor: not-allowed; }
  .pay-opt .soon { margin-left: auto; flex: none; font-size: .8rem; font-weight: 500; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; }
  .add-btn.wa { background: #25D366; color: #06301A; height: 48px; padding: 0 26px; }
  .site-footer a { color: inherit; }
  .co-summary { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 20px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 88px); }
  .co-summary h3 { margin: 0 0 8px; font-family: var(--display); font-size: 1.15rem; }
  .sum-row { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .sum-row span:first-child { min-width: 0; overflow-wrap: anywhere; }
  .sum-total { border-bottom: 0; padding-bottom: 0; font-weight: 700; font-size: 1.2rem; }
  .co-error { color: var(--danger); font-weight: 500; margin: 0 0 12px; }
  .co-form .checkout { width: 100%; }
  .thanks { max-width: 560px; margin: 0 auto; text-align: center; padding: 40px 0; }
  .thanks p { color: var(--muted); }
  .thanks .ref { display: inline-block; margin: 8px 0 20px; padding: 8px 16px; border: 1.5px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--ink); font-weight: 700; }
  .thanks .add-btn { display: inline-flex; align-items: center; text-decoration: none; }

  /* Phones and tablets (any orientation) and narrow windows: 2 products per row */
  @media (max-width: 900px), (pointer: coarse) {
    .products { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .card { border-radius: 16px; }
    .card-body { padding: 12px; }
    .card-name { font-size: .95rem; }
    .card-foot { flex-wrap: wrap; gap: 8px; }
    .price { font-size: 1.05rem; }
    .add-btn { height: 38px; padding: 0 16px; }
  }

  /* ---------- Ratings & reviews ---------- */
  .stars {
    display: inline-block; font-size: 1.05rem; line-height: 1; letter-spacing: 1px; white-space: nowrap;
    background: linear-gradient(90deg, var(--star) calc(var(--r, 0) / 5 * 100%), var(--star-off) 0);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
  }
  .stars::before { content: "★★★★★"; }
  .rating-line { display: flex; align-items: center; gap: 6px; min-height: 22px; font-size: .85rem; color: var(--muted); }
  .rating-line strong { color: var(--ink); }
  .rating-link { display: inline-flex; background: none; border: 0; padding: 0; margin: 0 0 12px; font: inherit; color: var(--muted); cursor: pointer; }
  .rating-link:hover .rating-line { text-decoration: underline; }
  .rating-link .stars { font-size: 1.25rem; }
  .rating-link .rating-line { font-size: 1rem; }
  .reviews { margin-bottom: 56px; scroll-margin-top: calc(env(safe-area-inset-top, 0px) + 84px); }
  .rev-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: clamp(20px, 4vw, 48px); align-items: start; margin-bottom: 24px; }
  @media (max-width: 720px) { .rev-layout { grid-template-columns: minmax(0, 1fr); } }
  .rev-summary { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 20px; }
  .rev-avg { font-family: var(--display); font-weight: 800; font-size: 3rem; line-height: 1; }
  .rev-summary .stars { font-size: 1.3rem; margin-top: 8px; }
  .rev-count { color: var(--muted); margin: 4px 0 14px; }
  .bar-row { display: grid; grid-template-columns: 34px minmax(0, 1fr) 28px; align-items: center; gap: 8px; padding: 3px 0; font-size: .85rem; color: var(--muted); }
  .bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .bar > span { display: block; height: 100%; background: var(--star); }
  .rev-list { display: grid; gap: 12px; margin: 0; padding: 0; list-style: none; }
  .rev { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
  .rev-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin-bottom: 6px; }
  .rev-name { font-weight: 700; }
  .rev-date { color: var(--muted); font-size: .85rem; }
  .rev p { margin: 0; line-height: 1.55; overflow-wrap: anywhere; }
  .badge { font-size: .75rem; font-weight: 700; border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; color: var(--muted); }
  .rev-empty { color: var(--muted); margin: 0; padding: 8px 0; }
  .star-label { display: block; margin-bottom: 4px; font-size: .85rem; color: var(--muted); }
  .star-input { position: relative; display: inline-flex; flex-direction: row-reverse; gap: 2px; }
  .star-input input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .star-input label { font-size: 2.2rem; line-height: 1; padding: 0 2px; cursor: pointer; color: var(--star-off); }
  .star-input input:checked ~ label, .star-input label:hover, .star-input label:hover ~ label { color: var(--star); }
  .star-input input:focus-visible + label { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
  .note { margin: 0; font-size: .85rem; color: var(--muted); }
  .co-card .add-btn.wide { justify-self: start; }

  /* ---------- Favourites ---------- */
  .fav-btn {
    width: 40px; height: 40px; padding: 0; border-radius: 50%;
    border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
    display: grid; place-items: center;
  }
  .fav-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linejoin: round; }
  .fav-btn[aria-pressed="true"] { color: var(--heart); border-color: var(--heart); }
  .fav-btn[aria-pressed="true"] svg { fill: currentColor; }
  .card .fav-btn { position: absolute; top: 10px; right: 10px; z-index: 2; }
  .fav-btn.big { width: auto; height: 52px; padding: 0 22px; border-radius: 999px; display: inline-flex; align-items: center; gap: 8px; font-weight: 700; }
  @media (prefers-reduced-motion: no-preference) {
    .fav-btn[aria-pressed="true"] svg { animation: heart-pop .3s cubic-bezier(.2,.8,.2,1); }
  }
  @keyframes heart-pop { 0% { transform: scale(.7); } 60% { transform: scale(1.25); } 100% { transform: scale(1); } }
  @media (max-width: 560px) { .site-header { gap: 8px; } }
  @media (max-width: 400px) { .brand { font-size: 1.1rem; } }

  /* ---------- Collections menu (shown on category pages) ---------- */
  .subnav { border-bottom: 1px solid var(--line); background: var(--bg); padding: 0 clamp(14px, 3vw, 32px); }
  .subnav-inner { max-width: 1280px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; padding: 10px 0; }
  .sub-btn { height: 40px; padding: 0 16px; border-radius: 999px; border: 1.5px solid transparent; background: transparent; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
  .sub-btn:hover { background: var(--surface); }
  .sub-btn[aria-pressed="true"], .sub-btn.active { background: var(--ink); color: var(--on-ink); }

  /* ====== Ratings ====== */
  function ratingStats(id) {
    const list = [...(userReviews[id] || []).map(r => ({ ...r, mine: true })), ...(SAMPLE_REVIEWS[id] || [])]
      .sort((a, b) => (b.date || "").localeCompare(a.date || ""));
    const count = list.length;
    const avg = count ? list.reduce((t, r) => t + r.rating, 0) / count : 0;
    const dist = [0, 0, 0, 0, 0, 0];
    list.forEach(r => { dist[r.rating]++; });
    return { list, count, avg, dist };
  }
  function ratingLineHTML(id) {
    const { count, avg } = ratingStats(id);
    if (!count) return `<span class="rating-line">No reviews yet</span>`;
    return `<span class="rating-line"><span class="stars" style="--r:${avg.toFixed(2)}" role="img" aria-label="Rated ${avg.toFixed(1)} out of 5"></span><span><strong>${avg.toFixed(1)}</strong> (${count})</span></span>`;
  }

  function renderProducts() {
    const q = query.trim().toLowerCase();
    const lo = parseFloat(minP), hi = parseFloat(maxP);
    const list = PRODUCTS.filter(p =>
      (filter === "all" || p.cat === filter) &&
      (!q || p.name.toLowerCase().includes(q) || catName(p.cat).toLowerCase().includes(q) || p.brand.toLowerCase().includes(q)) &&
      (!subSel || p.sub === subSel) &&
      (!brandSel || p.brand === brandSel) &&
      (collection !== "deals" || p.oldPrice) &&
      (collection !== "best" || p.best) &&
      (isNaN(lo) || p.price >= lo) &&
      (isNaN(hi) || p.price <= hi) &&
      (!minRating || ratingStats(p.id).avg >= minRating)
    );
    if (sortBy === "low") list.sort((a, b) => a.price - b.price);
    else if (sortBy === "high") list.sort((a, b) => b.price - a.price);
    else if (sortBy === "rating") list.sort((a, b) => { const A = ratingStats(a.id), B = ratingStats(b.id); return B.avg - A.avg || B.count - A.count; });
    else if (sortBy === "az") list.sort((a, b) => a.name.localeCompare(b.name));
    else if (collection === "top") list.sort((a, b) => b.sold - a.sold);

        </li>`).join("")}</ul>` : "";
    $("#reviews").innerHTML = `
      <h2 class="related-title" id="rev-title">Ratings and reviews</h2>
      <div class="rev-layout">${summary}<div>${list}</div></div>
      <form id="review-form" data-product="${p.id}">
        <fieldset class="co-card">
          <legend>Write a review</legend>
          <div class="wide">
            <span class="star-label">Your rating</span>
            <div class="star-input" role="radiogroup" aria-label="Your rating">
              ${[5, 4, 3, 2, 1].map(n => `<input type="radio" name="rating" id="rate${n}" value="${n}" required><label for="rate${n}" title="${n} ${n === 1 ? "star" : "stars"}"><span aria-hidden="true">★</span><span class="sr-only">${n} ${n === 1 ? "star" : "stars"}</span></label>`).join("")}
            </div>
          </div>
          <label class="field wide">Your name <input name="rname" required maxlength="40" autocomplete="name"></label>
          <label class="field wide">Your review <textarea name="rtext" rows="4" required minlength="10" maxlength="600" placeholder="What did you like or dislike?"></textarea></label>
          <p class="note wide">Reviews you post are saved in this browser.</p>
          <button class="add-btn big wide" type="submit">Submit review</button>
        </fieldset>
      </form>`;
  }

  /* ====== Views: home, list, product, checkout, thanks ====== */
  /* ====== Navigation ======
     In-app links are handled here instead of by the browser, so they also work inside
     app viewers that show the page in a sandboxed frame. */
  let routeOverride = null;
  const currentHash = () => (routeOverride !== null ? routeOverride : location.hash);
  function go(h) {
    routeOverride = null;
    if (location.hash === h) { route(); return; }
    try { location.hash = h; } catch (e) {}
    if (location.hash !== h) { routeOverride = h; route(); }
  }

  let view = "home";
  const SECTIONS = { home: "#hero", list: "#products", product: "#product", favourites: "#favourites-page", checkout: "#checkout-page", thanks: "#thanks-page" };
  function route() {
    const h = currentHash();
    const mc = h.match(/^#\/c\/([a-z]+)(?:\/([a-z0-9-]+))?$/);
    const mp = h.match(/^#\/p\/(\d+)$/);
    const prod = mp && PRODUCTS.find(p => p.id === +mp[1]);
    if (prod) view = "product";
    else if (mc && CATEGORIES.some(c => c.id === mc[1])) { filter = mc[1]; subSel = (SUBCATS[mc[1]] || []).some(x => x.id === mc[2]) ? mc[2] : ""; view = "list"; }
    else if (h === "#/all") { filter = "all"; subSel = ""; view = "list"; }
    else if (h === "#/favourites") view = "favourites";
    else if (h === "#/checkout") view = "checkout";
    else if (h === "#/thanks") view = "thanks";
    else view = "home";

    if (view === "home") { query = ""; $("#search").value = ""; lastList = null; }
    if (view === "list") { if (lastList !== filter) resetFilters(); lastList = filter; }

    Object.entries(SECTIONS).forEach(([v, sel]) => { $(sel).hidden = v !== view; });
    $("#subnav").hidden = view !== "list";
    setBrandPop(false);
    if (view === "list") { renderChips(); renderSubcats(); buildBrandUI(); renderProducts(); }
    if (view === "product") { renderProduct(prod); renderReviews(prod); }
    if (view === "favourites") renderFavourites();
    if (view === "checkout") renderCheckout();
    if (view === "thanks") renderThanks();
    if (view !== "list") {
      document.title = view === "product" ? prod.name + " – BuyfromGAB"
        : view === "checkout" ? "Checkout – BuyfromGAB"
        : view === "favourites" ? "Favourites – BuyfromGAB"
        : view === "thanks" ? "Order received – BuyfromGAB"
        : "BuyfromGAB – Shop by category";
    }
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", () => { routeOverride = null; route(); });

  /* ====== Checkout page ====== */
  function cartTotal() { return cartLines().reduce((s, l) => s + l.qty * l.p.price, 0); }

  function renderCheckout() {
    const lines = cartLines();
    const box = $("#checkout-page");
    if (!lines.length) {
      box.innerHTML = `<div class="thanks"><h1 class="page-title">Your cart is empty</h1><p>Add a few products first, then come back to pay.</p><a class="add-btn" href="#/">Browse categories</a></div>`;
      return;
    }
    const total = cartTotal();
    box.innerHTML = `
      <a class="back-link" href="#/all">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        Keep shopping
      </a>
      <h1 class="page-title">Checkout</h1>
      <div class="co">
        <form class="co-form" id="co-form">
          <fieldset class="co-card">
            <legend>Delivery details</legend>
            <label class="field wide">Full name <input name="name" required autocomplete="name"></label>
            <label class="field">Phone number <input name="phone" type="tel" inputmode="tel" required autocomplete="tel" placeholder="024 123 4567"></label>
            <label class="field">Email (optional) <input name="email" type="email" autocomplete="email" placeholder="you@example.com"></label>
            <label class="field wide">Delivery address <textarea name="address" rows="3" required autocomplete="street-address" placeholder="House number, street, area, city"></textarea></label>
          </fieldset>
          <fieldset class="co-card">
            <legend>Pay with</legend>
            ${PAYMENT_METHODS.map((m, i) => `<label class="pay-opt${m.enabled ? "" : " disabled"}"><input type="radio" name="method" value="${m.id}" ${m.enabled && i === 0 ? "checked" : ""} ${m.enabled ? "" : "disabled"}><span><strong>${m.name}</strong><small>${m.note}</small></span>${m.enabled ? "" : `<span class="soon">Coming soon</span>`}</label>`).join("")}
          </fieldset>
          <p class="co-error" id="co-error" role="alert" hidden></p>
          <button class="checkout" id="pay-btn" type="submit">Send order on WhatsApp</button>
        </form>
        <aside class="co-summary" aria-label="Order summary">
          <h3>Order summary</h3>
          ${lines.map(({ p, qty }) => `<div class="sum-row"><span>${p.name} × ${qty}</span><span>${money(p.price * qty)}</span></div>`).join("")}
          <div class="sum-row sum-total"><span>Total</span><span>${money(total)}</span></div>
        </aside>
      </div>`;
  }

  const newRef = () => "BZ" + Date.now().toString(36).toUpperCase() + Math.random().toString(36).slice(2, 6).toUpperCase();

  function waUrl(order) {
    if (!order) return "https://wa.me/" + WHATSAPP_NUMBER;
    const lines = [
      "Hello, I'd like to place an order.",
      "",
      "Order: " + order.ref,
      "Name: " + order.name,
      "Phone: " + order.phone,
      "Delivery address: " + order.address,
      "",
      "Items:",
      ...order.items.map(i => "- " + i.qty + " × " + i.name + " (" + money(i.price * i.qty) + ")"),
      "",
      "Total: " + money(order.total),
      "I'd like to pay via WhatsApp."
    ];
    return "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent(lines.join("\n"));
  }

  function waProductUrl(p, qty) {
    const lines = [
      "Hello, I'd like to buy this product:",
      "",
      p.name + (p.brand ? " (" + p.brand + ")" : ""),
      "Quantity: " + qty,
      "Price: " + money(p.price) + " each",
      "Total: " + money(p.price * qty)
    ];
    if (/^https?:/.test(location.protocol)) lines.push("", "Link: " + location.href.split("#")[0] + "#/p/" + p.id);
    return "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent(lines.join("\n"));
  }

  function renderThanks() {
    let o = lastOrder;
    if (!o) { try { o = JSON.parse(localStorage.getItem("bazaar-last-order") || "null"); } catch (e) {} }
    cart = {}; saveCart(); renderCart();
    const first = o && o.name ? ", " + esc(o.name.split(" ")[0]) : "";
    $("#thanks-page").innerHTML = `
      <div class="thanks">
        <h1 class="page-title">Thank you${first}</h1>
        <p>${o ? "Your order is ready. Send it on WhatsApp so we can confirm it and arrange payment." : "Chat with us on WhatsApp to place an order or ask a question."}</p>
        ${o && o.ref ? `<div class="ref">Order ${esc(o.ref)}</div>` : ""}
        <p><a class="add-btn wa" href="${waUrl(o)}" target="_blank" rel="noopener">${o ? "Send order on WhatsApp" : "Chat on WhatsApp"}</a></p>
        <p>You can also message us on ${WHATSAPP_DISPLAY}.</p>
        <p><a href="#/">Continue shopping</a></p>
      </div>`;
  }

  function showPayError(msg) {
    const el = $("#co-error"); if (!el) return;
    el.textContent = msg; el.hidden = false;
  }

  /* ====== Cart ====== */
  function cartLines() {
    return Object.entries(cart).map(([id, qty]) => ({ p: PRODUCTS.find(x => x.id === +id), qty })).filter(l => l.p);
  }
  function renderCart() {
    const lines = cartLines();
    const count = lines.reduce((s, l) => s + l.qty, 0);
    const total = lines.reduce((s, l) => s + l.qty * l.p.price, 0);
    $("#cart-count").textContent = count;
    $("#cart-total").textContent = money(total);
    $("#checkout").disabled = !lines.length;
    $("#cart-items").innerHTML = lines.length ? lines.map(({ p, qty }) => `
      <li class="cart-row">
        <div class="mini">${p.emoji}</div>
        <div><div class="nm">${p.name}</div><div class="pr">${money(p.price)}</div></div>
        <div class="qty">
          <button type="button" data-dec="${p.id}" aria-label="Remove one ${p.name}">−</button>
          <span>${qty}</span>
          <button type="button" data-inc="${p.id}" aria-label="Add one ${p.name}">+</button>
        </div>
      </li>`).join("")
      : `<li class="cart-empty">Your cart is empty. Add something you like.</li>`;
  }
  function addToCart(id, n = 1) {
    cart[id] = (cart[id] || 0) + n;
    saveCart(); renderCart();
    toast(`Added ${n > 1 ? n + " × " : ""}${PRODUCTS.find(p => p.id === id).name}`);
  }
  function changeQty(id, delta) {
    cart[id] = (cart[id] || 0) + delta;
    if (cart[id] <= 0) delete cart[id];
    saveCart(); renderCart();
  }

  /* ====== Drawer ====== */
  let lastFocus = null;
  function openCart() {
    lastFocus = document.activeElement;
    $("#drawer").classList.add("open"); $("#overlay").classList.add("open");
    $("#drawer").setAttribute("aria-hidden", "false");
    $("#close-cart").focus();
  }
  function closeCart() {
    $("#drawer").classList.remove("open"); $("#overlay").classList.remove("open");
    $("#drawer").setAttribute("aria-hidden", "true");
    if (lastFocus) lastFocus.focus();
  }

  /* ====== Toast ====== */
  let toastTimer;
  function toast(msg) {
    const t = $("#toast");
    t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
  }

  /* ====== Events ====== */
  document.addEventListener("click", (e) => {
    const chip = e.target.closest(".chip");
    if (chip && chip.dataset.filter) { go(chip.dataset.filter === "all" ? "#/all" : "#/c/" + chip.dataset.filter); return; }
    const link = e.target.closest('a[href^="#/"]');
    if (link && e.button === 0 && !e.metaKey && !e.ctrlKey && !e.shiftKey) { e.preventDefault(); go(link.getAttribute("href")); return; }
    if (!e.target.closest(".brand-menu")) setBrandPop(false);
    if (e.target.closest("#brands-btn")) { setBrandPop($("#brands-pop").hidden); return; }
    const bo = e.target.closest("[data-brand]");
    if (bo) { brandSel = bo.dataset.brand; setBrandPop(false); syncBrandUI(); renderProducts(); return; }
    const co = e.target.closest("[data-coll]");
    if (co) { collection = collection === co.dataset.coll ? "" : co.dataset.coll; syncBrandUI(); renderProducts(); return; }
    const fav = e.target.closest("[data-fav]");
    if (fav) { toggleFav(+fav.dataset.fav); return; }
    if (e.target.closest("[data-scroll-reviews]")) { $("#reviews").scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth" }); return; }
    if (e.target.closest("[data-pd-inc]")) { pdQty = Math.min(pdQty + 1, 99); $("#pd-qty").textContent = pdQty; $("#pd-wa").href = waProductUrl(currentProd, pdQty); return; }
    if (e.target.closest("[data-pd-dec]")) { pdQty = Math.max(pdQty - 1, 1); $("#pd-qty").textContent = pdQty; $("#pd-wa").href = waProductUrl(currentProd, pdQty); return; }
    const addPd = e.target.closest("[data-add-pd]");
    if (addPd) { addToCart(+addPd.dataset.addPd, pdQty); return; }
    const add = e.target.closest("[data-add]");
    if (add) { addToCart(+add.dataset.add); return; }
    const inc = e.target.closest("[data-inc]");
    if (inc) { changeQty(+inc.dataset.inc, 1); return; }
    const dec = e.target.closest("[data-dec]");
    if (dec) { changeQty(+dec.dataset.dec, -1); return; }
  });
  $("#open-cart").addEventListener("click", openCart);
  $("#close-cart").addEventListener("click", closeCart);
  $("#overlay").addEventListener("click", closeCart);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") { setBrandPop(false); if ($("#drawer").classList.contains("open")) closeCart(); } });
  $("#search").addEventListener("input", (e) => {
    query = e.target.value;
    if (view === "list") renderProducts();
    else if (query.trim()) go("#/all");
  });
  $("#sort").addEventListener("change", (e) => { sortBy = e.target.value; renderProducts(); });
  $("#min").addEventListener("input", (e) => { minP = e.target.value; renderProducts(); });
  $("#max").addEventListener("input", (e) => { maxP = e.target.value; renderProducts(); });
  $("#min-rating").addEventListener("change", (e) => { minRating = +e.target.value; renderProducts(); });
  $("#brand-filter").addEventListener("change", (e) => { brandSel = e.target.value; syncBrandUI(); renderProducts(); });
  $("#reset-filters").addEventListener("click", () => { resetFilters(); renderProducts(); });
  $("#checkout").addEventListener("click", () => {
    if (!cartLines().length) return;
    closeCart();
    go("#/checkout");
  });
  document.addEventListener("submit", (e) => {
    if (e.target.id === "review-form") {
      e.preventDefault();
      const id = +e.target.dataset.product;
      const prod = PRODUCTS.find(x => x.id === id);
      const f = new FormData(e.target);
      const rating = Math.min(5, Math.max(1, parseInt(f.get("rating"), 10) || 0));
      const name = String(f.get("rname")).trim();
      const text = String(f.get("rtext")).trim();
      if (!prod || !rating || !name || text.length < 10) return;
      const d = new Date();
      const date = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
      (userReviews[id] = userReviews[id] || []).push({ name, rating, text, date });
      saveReviews();
      renderReviews(prod);
      $("#pd-rating").innerHTML = ratingLineHTML(id);
      toast("Thanks for your review");
      return;
    }
    if (e.target.id !== "co-form") return;
    e.preventDefault();
    const lines = cartLines();
    if (!lines.length) return;
    const f = new FormData(e.target);
    const method = f.get("method");
    const chosen = PAYMENT_METHODS.find(m => m.id === method);
    if (!chosen || !chosen.enabled) { showPayError("Choose an available payment option."); return; }
    const order = {
      ref: newRef(),
      method,
      name: String(f.get("name")).trim(),
      phone: String(f.get("phone")).trim(),
      email: String(f.get("email") || "").trim(),
      address: String(f.get("address")).trim(),
      total: cartTotal(),
      items: lines.map(({ p, qty }) => ({ id: p.id, name: p.name, qty, price: p.price }))
    };
    lastOrder = order;
    try { localStorage.setItem("bazaar-last-order", JSON.stringify(order)); } catch (err) {}
    // Open WhatsApp with the order; the thank-you page also has a button in case a pop-up is blocked.
    try { window.open(waUrl(order), "_blank", "noopener"); } catch (err) {}
    go("#/thanks");
  });
  $("#brand").addEventListener("click", (e) => {
    e.preventDefault();
    go("#/");
  });

  /* ====== Theme (light / dark) ====== */
  const ICON_MOON = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>`;
  const ICON_SUN = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>`;
  const prefersDark = window.matchMedia("(prefers-color-scheme: dark)");
  const currentTheme = () => document.documentElement.getAttribute("data-theme") || (prefersDark.matches ? "dark" : "light");
  function syncThemeButton() {
    const dark = currentTheme() === "dark";
    const b = $("#theme-toggle");
    b.innerHTML = dark ? ICON_SUN : ICON_MOON;
    b.setAttribute("aria-label", dark ? "Switch to light mode" : "Switch to dark mode");
  }
  $("#theme-toggle").addEventListener("click", () => {
    const next = currentTheme() === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("bazaar-theme", next); } catch (e) {}
    syncThemeButton();
  });
  prefersDark.addEventListener("change", syncThemeButton);

  /* ====== Init ====== */
  syncThemeButton();
  $("#year").textContent = new Date().getFullYear();
  renderTiles(); renderCart(); route();
</script>
</body>
</html>
